services:
  - type: web
    name: nathaniel-portfolio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: RENDER_DISK_PATH
        value: /var/data
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
